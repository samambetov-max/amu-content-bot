# Настройки бота, который отвечает клиентам от вашего имени (Telegram Business → Автоматизация чатов).
# Этот файл можно менять в любой момент: бот перечитывает его при каждом ответе.
# Стиль общения и менталитет — в config/clientbot_style.md.
# Факты о компании (услуги, контакты, часы) бот берёт из config/brand.yaml → company.

# Как зовут вас: бот пишет от вашего имени, в первом лице
owner:
  name: ""               # ваше имя, например «Самат». Бот представится так, если клиент спросит
  role: менеджер         # кем вы представляетесь клиентам: менеджер, руководитель, логист…
  gender: male           # male / female: чтобы правильно писать «понял/поняла», «сделал/сделала»

# Включён ли автоответ вообще (то же, что команды /on и /off в чате с ботом)
enabled: true

# Через сколько секунд тишины после последнего сообщения клиента бот отвечает.
# Клиенты часто пишут несколькими сообщениями подряд: бот ждёт, пока клиент допишет.
debounce_seconds: 25

# Дополнительная случайная пауза перед ответом (секунды), чтобы не отвечать мгновенно, как робот
reply_delay_seconds: [5, 40]

# Если вы сами ответили клиенту, бот не вмешивается в этот чат столько часов
owner_takeover_hours: 6

# Ночью бот не отвечает (по Ташкенту), а отвечает утром. Уберите строку, чтобы отвечал круглосуточно.
quiet_hours: [23, 8]

# Сколько последних сообщений переписки бот видит при ответе
history_messages: 40

# Обучение: после стольких новых ваших ответов клиентам бот пересматривает свои правила
learn_every_owner_messages: 15

# ИИ. provider:
#   anthropic   — Claude по API-ключу ANTHROPIC_API_KEY (самый быстрый и умный вариант для живых чатов)
#   claude_code — Claude по подписке Pro/Max (CLAUDE_CODE_OAUTH_TOKEN), отвечает медленнее
#   gemini      — Google Gemini, бесплатный тариф (GEMINI_API_KEY)
# Если выбранный ИИ недоступен, бот сам переключится на другой, для которого есть ключ.
llm:
  provider: anthropic
  anthropic_model: claude-opus-5-5
  effort: medium              # low — быстрее и дешевле, high — вдумчивее
  claude_code_model: sonnet
  gemini_models: [gemini-flash-latest, gemini-2.5-flash]
