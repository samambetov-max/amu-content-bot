# Настройки контент-бота AMU Logistics.
# Этот файл можно менять в любой момент: бот читает его при каждом запуске.
# Стратегию (частота, форматы, часы, стиль) бот подстраивает сам в data/strategy.json.

company:
  name: AMU Logistics
  since: 2017
  clients: около 300     # примерное число клиентов, бот упоминает его в постах о компании
  description: >
    Доставка грузов из Китая в Узбекистан и страны Центральной Азии под ключ:
    ЖД контейнеры 20'/40' через Хоргос и Алашанькоу, целые фуры (FTL), сборные грузы (LCL),
    авиадоставка, склад и консолидация в Китае, таможенное оформление (импорт, экспорт, транзит T1,
    коды ТН ВЭД), выкуп товара у поставщика. Свои люди в Китае (офис в Шэньчжэне) и в Узбекистане.
    Доставка по всему Узбекистану. Возим товары для магазинов и оптовиков, оборудование, стройматериалы,
    запчасти, текстиль, электронику, товары для маркетплейсов.
  audience: >
    Предприниматели Узбекистана и Каракалпакстана, которые возят товар из Китая: владельцы магазинов,
    оптовики, маркетплейс-селлеры, производства, закупающие оборудование. Многие впервые сталкиваются с таможней.
  hours: Пн–Сб, 9:00–18:00
  contacts:
    phone: "+86 193 2064 5050"      # основной: в тексте и на последнем слайде
    phone_uz: "+998 33 150 88 88"   # второй номер в тексте; оставьте пустым "", чтобы не показывать
    telegram_channel: "@amulogistics"
    telegram_bot: ""        # например @amulogistics_bot, когда бот заработает
    instagram: "@amulogistics"
    site: ""                # адрес сайта, когда появится

# Языки постов. Порядок = порядок в подписи. kaa — каракалпакский (латиница).
languages: [ru]          # вернуть каракалпакский: [ru, kaa]
# Какие языки печатать на картинках (можно оставить один, чтобы картинки были чище)
card_languages: [ru]          # вернуть каракалпакский: [ru, kaa]

timezone: Asia/Tashkent

# Модерация:
#   auto_after_timeout — черновик приходит админу; нет ответа approval_timeout_hours → публикуется сам
#   manual             — публикуется только после кнопки «Опубликовать»
#   auto               — публикуется сразу, админу приходит копия
approval_mode: auto_after_timeout
approval_timeout_hours: 2

# Фото на обложках: доля бесплатных стоковых фото (Pixabay, Pexels, Openverse CC0) по теме поста, остальное — ваши фото
# из assets/photos. 0 — только ваши фото, 1 — только стоки (ваши остаются запасными).
stock_photo_share: 0.6

# Площадки: можно временно выключить
platforms:
  telegram: true
  instagram: true

# ИИ. provider:
#   claude_code — Claude по вашей подписке Pro/Max (токен из `claude setup-token`)
#   anthropic   — Claude по API-ключу (оплата отдельно)
#   gemini      — Google Gemini, бесплатный тариф
# Если выбранный ИИ недоступен (лимит, ошибка), бот сам переключится на другой, для которого есть ключ.
llm:
  provider: claude_code
  claude_code_model: sonnet
  gemini_models: [gemini-flash-latest, gemini-2.5-flash]
  anthropic_model: claude-sonnet-5-5

# Типы контента. Бот выбирает тип по весам из data/strategy.json и сам подбирает тему.
content_types:
  customs_faq: Ответ на частый вопрос о растаможке (пошлины, НДС, сборы, документы, коды ТН ВЭД, сертификаты, сроки)
  law_update: Новый закон, постановление, изменение ставок или правил ввоза — простыми словами, что это значит для бизнеса
  useful_tips: Практичный совет импортёру (как выбрать транспорт, упаковка, как не переплатить, как проверить поставщика)
  interesting_fact: Интересный факт о логистике, Китае, Шёлковом пути, контейнерах, торговле Узбекистана
  news_hype: Обсуждаемая новость рынка (курсы, маршруты, границы, маркетплейсы, ВЭД) и чем она важна для импортёра
  company_service: Рассказ об услуге AMU Logistics через пользу для клиента, без навязчивой рекламы
  welcome: >
    Первый, приветственный пост канала — о логистике и о компании, а не о таможне: тёплое приветствие,
    кто мы (AMU Logistics, возим грузы из Китая с 2017 года, около 300 клиентов), как везём (ЖД контейнеры
    через Хоргос и Алашанькоу, целые фуры, сборные грузы, авиа), что везём (товары для магазинов и оптовиков,
    оборудование, стройматериалы, запчасти, электроника), свои люди в Китае, склад и консолидация, доставка
    до двери; что будет в канале; приглашение подписаться и задавать вопросы. Таможне — не больше одной строки.
  holiday: Поздравление с праздником (только когда праздник сегодня или завтра)

# Правила тона: учитывают менталитет Узбекистана и Каракалпакстана
tone_rules:
  - Обращаться на «Вы», уважительно и тепло, как к партнёру; без фамильярности и сленга
  - Писать просто и конкретно, как опытный брокер объясняет другу-предпринимателю; без канцелярита
  - Опираться на ценности, близкие аудитории: надёжность, честность, семья, доверие, гостеприимство, уважение к старшим
  - Цифры, ставки и даты законов — только проверенные, со ссылкой на источник (lex.uz, customs.uz); если не уверен — не указывать цифру
  - Не обещать того, что зависит от таможни; не давать гарантий сроков
  - Без политики, религиозных споров, шуток над нациями, регионами, религией и традициями
  - Без алкоголя, табака, азартных игр и свинины в примерах и картинках
  - Уместно учитывать Рамадан, Хайиты, Навруз и другие праздники
  - Только русский язык. Никаких узбекских слов («Ассалому алайкум», «Хуш келибсиз», «рахмат» — нельзя).
    Иногда, к месту, можно 1–2 каракалпакских слова латиницей, например «Assalawma áleykum», «Xosh keldińiz»
  - Не упоминать город, где находится компания, и не писать «мы из …»
  - Эмодзи — умеренно, 2–5 на пост
  - В конце — мягкий призыв: написать в Telegram или позвонить для расчёта

# Праздники с фиксированной датой (месяц-день). Хайиты бот уточняет через поиск.
holidays:
  "01-01": Новый год
  "01-14": День защитников Родины
  "03-08": Международный женский день
  "03-21": Навруз
  "05-09": День памяти и почестей
  "09-01": День независимости Узбекистана
  "10-01": День учителей и наставников
  "12-08": День Конституции Узбекистана

# Источники новостей (RSS). Бот берёт отсюда свежие темы и дополнительно ищет в Google.
news_feeds:
  - https://kun.uz/news/rss
  - https://www.gazeta.uz/ru/rss/
  - https://daryo.uz/feed
  - https://www.spot.uz/ru/rss/
news_keywords: [таможн, пошлин, импорт, экспорт, логист, Китай, Хитой, Xitoy, bojxona, tamojnya, НДС, тариф, ВЭД, транзит,
  контейнер, фур, железн, грузов, маркетплейс, Хоргос, курс доллара, юан, сертификат, маркировк, Uzum, перевоз]

hashtags_base: ["#amulogistics", "#логистика", "#растаможка", "#Узбекистан", "#доставкаизКитая"]
